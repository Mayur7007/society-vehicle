<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Naroda Sky | Vehicle Search</title>

<!-- Bootstrap CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- jQuery -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
  body {
    font-family: 'Poppins', sans-serif;
  }

  /* Gradient background */
  .page-bg {
    background: linear-gradient(135deg, #4e73df, #1cc88a);
  }

  /* Card enhancements */
  .search-card {
    backdrop-filter: blur(6px);
  }
</style>
</head>

<body class="min-vh-100 d-flex align-items-center justify-content-center page-bg">

<div class="card shadow-lg border-0 rounded-4 p-4 text-center bg-white text-dark search-card"
     style="max-width: 500px; width: 100%;">

  <h2 class="fw-semibold mb-1">Naroda Sky</h2>
  <p class="small text-muted">Vehicle Information Lookup</p>

  <form id="searchForm" class="mt-4">

    <input
      type="text"
      id="vehicle_number"
      class="form-control form-control-lg rounded-pill mb-2 text-center bg-light"
      placeholder="GJ-01-AB-1234"
      maxlength="13"
      required
    >

    <div class="d-flex gap-2 mt-4">
      <button type="submit" class="btn btn-primary w-50 rounded-pill fw-medium">
        Search
      </button>
      <button type="button" id="cancelBtn" class="btn btn-outline-secondary w-50 rounded-pill fw-medium">
        Cancel
      </button>
    </div>

  </form>

  <div id="search-result" class="mt-3"></div>
</div>

<script>
const users = [
  { vehicle_number: "GJ-01-AB-1122", phone_number: "9876543210", unit_number: "A-101" , name: "asd"},
  { vehicle_number: "GJ-01-AB-1133", phone_number: "9876543211", unit_number: "A-102" , name: "mayur"},
  { vehicle_number: "GJ-01-AB-1144", phone_number: "9876543212", unit_number: "A-103" , name: "raju"},
  { vehicle_number: "GJ-01-AB-1155", phone_number: "9876543213", unit_number: "A-104" , name: "karan"},
  { vehicle_number: "GJ-01-AB-1166", phone_number: "9876543214", unit_number: "A-105" , name: "govind"},
  { vehicle_number: "MH-12-XY-3301", phone_number: "9123456701", unit_number: "C-301" , name: "456489"},
  { vehicle_number: "MH-12-XY-3302", phone_number: "9123456702", unit_number: "C-302" , name: "dvsdgnzsdfS"},
  { vehicle_number: "DL-05-PQ-4401", phone_number: "9988776601", unit_number: "D-401" , name: "fasddbte"},
  { vehicle_number: "RJ-14-MN-5501", phone_number: "9012345601", unit_number: "E-501" , name: "aewrvsdvs"},
];

const vehicleRegex = /^[A-Z]{2}-\d{2}-[A-Z]{2}-\d{4}$/i;

$("#searchForm").submit(function (e) {
  e.preventDefault();

  const input = $("#vehicle_number").val().trim();

  if (!vehicleRegex.test(input)) {
    $("#search-result").html(
      `<div class="alert alert-danger rounded-3">Invalid format. Example: GJ-01-AB-1234</div>`
    );
    return;
  }

  const user = users.find(
    u => u.vehicle_number.toLowerCase() === input.toLowerCase()
  );

  if (user) {
    $("#search-result").html(`
      <div class="alert alert-success text-start rounded-3">
        <strong>Vehicle Found</strong><br>
        🚗 <h3>${user.name}</h3><br>
        🚗 ${user.vehicle_number}<br>
        📞 ${user.phone_number}<br>
        🏠 ${user.unit_number}
      </div>
    `);
  } else {
    $("#search-result").html(
      `<div class="alert alert-warning rounded-3">No record found.</div>`
    );
  }
});

$("#cancelBtn").click(function () {
  $("#vehicle_number").val("").focus();
  $("#search-result").html("");
});
</script>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
