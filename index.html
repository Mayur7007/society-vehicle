<body class="min-vh-100 d-flex align-items-center justify-content-center page-bg">

<div class="card shadow-lg border-0 rounded-4 p-4 text-center bg-white text-dark search-card"

  <p class="small text-muted">Vehicle Information Lookup</p>

  <form id="searchForm" class="mt-4">

      type="text"
      id="vehicle_number"
      class="form-control form-control-lg rounded-pill mb-2 text-center bg-light"
      placeholder="GJ-01-AB-1234"
      maxlength="13"

      <button type="submit" class="btn btn-primary w-50 rounded-pill fw-medium">

      </button>
      <button type="button" id="cancelBtn" class="btn btn-outline-secondary w-50 rounded-pill fw-medium">
        Cancel
      </button>
    </div>

  <div id="search-result" class="mt-3"></div>

const vehicleRegex = /^[A-Z]{2}-\d{2}-[A-Z]{2}-\d{4}$/i;

  $(document).ready(function () {

    /* =========================
       SEARCH FORM
    ==========================*/
    $("#searchForm").on("submit", function (e) {
      e.preventDefault();

      const input = $("#vehicle_number").val().trim();

      if (!vehicleRegex.test(input)) {
        $("#search-result").html(
          `<div class="alert alert-danger rounded-3">
          Invalid format. Example: GJ-01-AB-1234
        </div>`
        );
        return;
      }

      let foundOwner = null;
      let foundVehicle = null;

      // Search inside nested vehicles
      OWNERS.forEach(owner => {
        owner.vehicles.forEach(vehicle => {
          if (vehicle.vehicle_number.toLowerCase() === input.toLowerCase()) {
            foundOwner = owner;
            foundVehicle = vehicle;
          }
        });
      });

      if (foundOwner) {
        $("#search-result").html(`
        <div class="alert alert-success text-start rounded-3">
          <strong>Vehicle Found</strong><br><br>
          👤 <strong>${foundOwner.name}</strong><br>
          🚗 ${foundVehicle.vehicle_number}<br>
          📞 ${foundOwner.phone}<br>
          🏠 ${foundOwner.unit} (Block ${foundOwner.block})<br>
          ✅ RC Verified: ${foundVehicle.rc_verified ? 'Yes' : 'No'}
        </div>
      `);
      } else {
        $("#search-result").html(
          `<div class="alert alert-warning rounded-3">
          No record found.
        </div>`
        );
      }
    });

    $("#cancelBtn").on("click", function () {
      $("#vehicle_number").val("").focus();
      $("#search-result").html("");
    });


    /* =========================
       TABLE VIEW (Hash Based)
    ==========================*/
    if (window.location.hash === "#table_view") {

      $('#search-view').hide();
      $('#table-view').show();

      renderBlocks();
    }
  });


  /* =========================
     RENDER BLOCKS
  ==========================*/
  function renderBlocks() {

    const grouped = {};

    // Group owners by block
    OWNERS.forEach(owner => {
      if (!grouped[owner.block]) {
        grouped[owner.block] = [];
      }
      grouped[owner.block].push(owner);
    });

    // Render each block
    Object.keys(grouped).forEach(block => {

      let html = '';

      grouped[block].forEach(owner => {

        const hasOwner = owner.name.length > 0;
        const color = hasOwner ? 'background-color: lightgreen;' : '';

        html += `
        <div style="margin:5px;">
          <button
            class="block-number btn btn-sm btn-outline-dark"
            style="${color}"
            data-unit="${owner.unit}">
            <b>${owner.unit}</b>
          </button>

          <table class="table mt-2"
                 id="${owner.unit}-table"
                 style="display:none;">
            <tr>
              <td><strong>Name:</strong> ${owner.name}</td>
            </tr>
            <tr>
              <td><strong>Phone:</strong> ${owner.phone}</td>
            </tr>
            <tr>
              <td><strong>Vehicles:</strong></td>
            </tr>
            ${owner.vehicles.map(v => `
              <tr>
                <td>${v.vehicle_number} (${v.type})</td>
              </tr>
            `).join('')}
          </table>
        </div>
      `;
      });

      $(`#block-${block}`).html(html);
    });

    // Event delegation (better than inline onclick)
    $(document).on('click', '.block-number', function () {
      const unit = $(this).data('unit');
      $(`#${unit}-table`).toggle();
    });
  }
</script>
