const vehicleRegex = /^[A-Z]{2}-\d{2}-[A-Z]{2}-\d{4}$/i;

$("#searchForm").submit(function (e) {
  e.preventDefault();

  const input = $("#vehicle_number").val().trim();

  if (!vehicleRegex.test(input)) {
    $("#search-result").html(
      `<div class="alert alert-danger rounded-3">Invalid format. Example: GJ-01-AB-1234</div>`
    );
    return;
  }

  const user = users.find(
    u => u.vehicle_number.toLowerCase() === input.toLowerCase()
  );

  if (user) {
    $("#search-result").html(`
      <div class="alert alert-success text-start rounded-3">
        <strong>Vehicle Found</strong><br>
        🚗 <h3>${user.name}</h3><br>
        🚗 ${user.vehicle_number}<br>
        📞 ${user.phone_number}<br>
        🏠 ${user.unit_number}
      </div>
    `);
  } else {
    $("#search-result").html(
      `<div class="alert alert-warning rounded-3">No record found.</div>`
    );
  }
});

$("#cancelBtn").click(function () {
  $("#vehicle_number").val("").focus();
  $("#search-result").html("");
});
